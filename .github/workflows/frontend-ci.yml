name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check generated API types are up to date
        run: |
          npm run gen:api
          if ! git diff --exit-code -- lib/api/schema.d.ts; then
            echo "::error file=frontend/lib/api/schema.d.ts::Generated API types are stale. Run 'npm run gen:api' in frontend/ and commit the result."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Run tests
        run: |
          if [ "$(npm pkg get scripts.test)" = "{}" ]; then
            echo "No test script in package.json, skipping."
          else
            npm test
          fi
