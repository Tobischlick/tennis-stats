# The crawler profile turns the API image into a run-once crawl process: no web server, exit when done.
spring.main.web-application-type=none
spring.main.banner-mode=off

tennisstats.crawler.enabled=true
tennisstats.crawler.request-delay=2s
tennisstats.crawler.base-url=https://baden.liga.nu/cgi-bin/WebObjects/nuLigaTENDE.woa/wa
tennisstats.crawler.federation=BAD
tennisstats.crawler.championships[0]=B1 S 2026
